[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "fightcore"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = ["numpy"]

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
build.verbose = false
cmake.build-type = "Release"

[tool.pytest.ini_options]
testpaths = ["tests"]
